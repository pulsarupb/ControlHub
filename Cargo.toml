[workspace]
resolver = "2"
members = ["driver", "web/src-tauri", "web/src-tauri/native", "web/src-tauri/native/switch-input", "web/src-tauri/native/android-updater"]

[workspace.package]
version = "0.1.49"
edition = "2024"

[workspace.dependencies]
moteus = { git = "https://github.com/mjbots/moteus", branch = "rust", package = "moteus", features = ["tokio", "clap"] }
