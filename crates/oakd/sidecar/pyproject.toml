[project]
name = "controlhub-oak-sidecar"
version = "0.1.0"
requires-python = ">=3.10"
# NumPy/OpenCV are supplied by the host to preserve the Jetson's native ABI.
dependencies = ["depthai==3.8.0"]

[tool.uv]
package = false
# DepthAI declares NumPy; use the host copy paired with its native OpenCV.
exclude-dependencies = ["numpy"]
