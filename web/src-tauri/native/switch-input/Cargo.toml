[package]
name = "tauri-plugin-switch-input"
version = "0.1.0"
authors = ["pulsarupb"]
description = "Capture Nintendo Switch (LineageOS/Android) hardware buttons, analog sticks, dpad, touch, IMU and rumble in Tauri apps."
edition = "2021"
license = "MIT"
repository = "https://github.com/pulsarupb/switch-android-tauri"
rust-version = "1.90"
links = "tauri-plugin-switch-input"
exclude = ["/android", "/permissions/autogenerated"]

[lib]
name = "tauri_plugin_switch_input"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-plugin = { version = "2.6.2", features = ["build"] }

[dependencies]
tauri = { version = "2.11.2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
