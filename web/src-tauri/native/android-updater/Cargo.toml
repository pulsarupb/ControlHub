[package]
name = "tauri-plugin-android-updater"
version = "0.1.0"
edition = "2024"
links = "tauri-plugin-android-updater"
build = "build.rs"

[lib]
name = "tauri_plugin_android_updater"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2.11.2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-plugin = { version = "2.6.2", features = ["build"] }
