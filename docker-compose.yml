services:
  driver:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ZED_SDK_VERSION: ${ZED_SDK_VERSION:-5.4}
    image: controlhub-driver:jetson
    container_name: controlhub-driver
    platform: linux/arm64
    restart: unless-stopped
    command:
      - --config
      - /data/rover16.json
      - --sidecar
      - /opt/controlhub/sidecar/main.py
      - --oak-sidecar
      - /opt/controlhub/oak-sidecar/main.py
      - --bind
      - 0.0.0.0:8080
      - --hotspot
    network_mode: host
    privileged: true
    runtime: nvidia
    init: true
    volumes:
      - /dev:/dev
      # Use the SDK/CUDA installed for this Jetson's exact JetPack release.
      - type: bind
        source: /usr/local/zed
        target: /usr/local/zed
        bind:
          create_host_path: false
      - type: bind
        source: /usr/local/cuda
        target: /usr/local/cuda
        read_only: true
        bind:
          create_host_path: false
      # The entrypoint exposes only TensorRT .so files from this read-only mount.
      - type: bind
        source: /usr/lib/aarch64-linux-gnu
        target: /opt/jetson-libs
        read_only: true
        bind:
          create_host_path: false
      - ./data:/data
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket
      - /var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket
    environment:
      - RUST_BACKTRACE=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
