services:
  driver:
    build:
      context: .
      dockerfile: Dockerfile
    image: controlhub-driver:jetson
    container_name: controlhub-driver
    platform: linux/arm64
    restart: unless-stopped
    network_mode: host
    privileged: true
    init: true
    volumes:
      - /dev:/dev
      - ./data:/data
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket
      - /var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket
    environment:
      - RUST_BACKTRACE=1
